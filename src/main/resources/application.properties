spring.application.name=backend
server.port=8081
server.error.include-message=always

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

app.frontend-url=${FRONTEND_URL}
app.company.name=${COMPANY_NAME}
app.company.address=${COMPANY_ADDRESS:Rabat, Maroc}
app.company.ice=${COMPANY_ICE:}
app.company.rc=${COMPANY_RC:}
app.company.email=${COMPANY_EMAIL:contact@cactusds.ma}
app.totp.encryption-key=${TOTP_ENCRYPTION_KEY}
app.totp.issuer=${TOTP_ISSUER}

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM}